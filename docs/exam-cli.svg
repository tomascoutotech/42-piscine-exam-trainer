<text x="22.0" y="195.2" fill="#c9d6e6" xml:space="preserve">    </text>
<text x="22.0" y="212.6" fill="#c9d6e6" xml:space="preserve">    Write a program that takes a string, and displays the first &#x27;z&#x27;</text>
