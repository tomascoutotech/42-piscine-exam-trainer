<text x="22.0" y="264.8" fill="#c9d6e6" xml:space="preserve">    by a newline. If the number of parameters is not 1, the program displays</text>
<text x="22.0" y="282.2" fill="#c9d6e6" xml:space="preserve">    &#x27;z&#x27; followed by a newline.</text>
<text x="22.0" y="299.6" fill="#c9d6e6" xml:space="preserve">                    [ ... o resto do enunciado ... ]</text>
